<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHADOWDARK // PANTALLA TÁCTICA GM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-brand">
      <span class="skull-icon">☠</span>
      <h1>SHADOWDARK <span>// GALAXY & DUNGEON GM TERMINAL</span></h1>
    </div>
    
    <div class="session-controls">
      <input type="text" id="sessionTitle" value="Campaña: Las Criptas de Myrkhos" title="Nombre de la sesión">
      <button id="btnSaveJson" class="btn btn-secondary">💾 Guardar (.JSON)</button>
      <button id="btnLoadJsonTrigger" class="btn btn-secondary">📂 Cargar (.JSON)</button>
      <input type="file" id="loadJsonInput" accept=".json" style="display: none;">
      <button id="btnResetSession" class="btn btn-danger">⚡ Purgar Mesa</button>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn" data-tab="tab-oraculo">🔮 ORÁCULO & SOLODARK</button>
    <button class="tab-btn active" data-tab="tab-cartografia">🗺️ CARTOGRAFÍA & LUGARES</button>
    <button class="tab-btn" data-tab="tab-asentamientos">🏰 ASENTAMIENTOS & SOCIEDAD</button>
    <button class="tab-btn" data-tab="tab-mazmorras">🗝️ MAZMORRAS & SALAS</button>
    <button class="tab-btn" data-tab="tab-npcs">👤 PNJS & SEGUIDORES</button>
    <button class="tab-btn" data-tab="tab-encuentros">🎲 ENCUENTROS & SUCESOS</button>
    <button class="tab-btn" data-tab="tab-tesoros">💰 TESOROS & ARTEFACTOS</button>
    <button class="tab-btn" data-tab="tab-monstruos">🐉 BESTIARIO & COMBATE</button>
  </nav>

  <main class="generator-console">
      
     <section id="tab-oraculo" class="tab-pane">
      <div class="generator-toolbar">
        <input type="text" id="oracleQuestionInput" placeholder="Escribe tu pregunta afirmativa (ej. ¿Hay guardias tras la puerta?)..." style="width: 380px;">
        
        <select id="oracleOddsSelect">
          <option value="unlikely">Poco Probable / Imposible (Desventaja)</option>
          <option value="even" selected>50 / 50 (Tirada Normal)</option>
          <option value="likely">Probable / Casi Seguro (Ventaja)</option>
        </select>

        <button class="btn btn-action-accent" id="btnRollOracle">🔮 Consultar Oráculo (d20)</button>
      </div>

      <div class="generator-toolbar" style="margin-top: 6px;">
        <button class="btn btn-action" id="btnRollPrompt">💡 Generar Estímulo / Idea (Verbo + Sustantivo)</button>
        <button class="btn btn-action" id="btnRollDungeonName">🗝️ Generar Nombre de Mazmorra</button>
      </div>

      <div class="preview-stage" id="oraculo-preview"></div>
    </section>

    <section id="tab-cartografia" class="tab-pane active">
      <div class="generator-toolbar">
        <button class="btn btn-action" id="genRegionBtn">Generar Nombre de Región</button>
        <button class="btn btn-action" id="genHitoBtn">Generar Hito / Punto de Interés</button>
        <button class="btn btn-action" id="genAventuraGanchoBtn">Gancho de Aventura Completo</button>
      </div>
      <div class="preview-stage" id="cartografia-preview"></div>
    </section>

    <section id="tab-asentamientos" class="tab-pane">
      <div class="generator-toolbar">
        <select id="settlementSize">
          <option value="aldea">Aldea (3d4)</option>
          <option value="pueblo" selected>Pueblo (4d4)</option>
          <option value="ciudad">Gran Ciudad (6d6)</option>
          <option value="metropolis">Metrópolis (8d8)</option>
        </select>
        <button class="btn btn-action" id="genSettlementBtn">Generar Asentamiento</button>

        <select id="tavernTierSelect" style="margin-left: 10px;">
          <option value="Pobre">Taberna Pobre (1d4 pc / 1d6 Bebidas)</option>
          <option value="Estandar" selected>Taberna Estándar (1d6 pp / 1d12 Bebidas)</option>
          <option value="Rica">Taberna Rica (1d8 po / 2d6 Bebidas)</option>
        </select>
        <button class="btn btn-action" id="genTavernBtn">Generar Taberna & Menú</button>

        <select id="shopTierSelect" style="margin-left: 10px;">
          <option value="pobre">Comercio Pobre (1d12)</option>
          <option value="estandar" selected>Comercio Estándar (1d10)</option>
          <option value="rica">Comercio Rico (1d10)</option>
        </select>
        <button class="btn btn-action" id="genShopBtn">Generar Comercio & Cliente</button>
      </div>
      <div class="preview-stage" id="asentamientos-preview"></div>
    </section>

    <section id="tab-mazmorras" class="tab-pane">
      <div class="generator-toolbar">
        <button class="btn btn-action" id="genDungeonBaseBtn">Cimientos & Ruina de Mazmorra</button>
        <button class="btn btn-action" id="genDungeonRoomBtn">Sondear Sala (Área & Peligro)</button>
        <button class="btn btn-action" id="genTrapBtn">Generar Trampa Modular</button>
      </div>
      <div class="preview-stage" id="mazmorras-preview"></div>
    </section>

    <section id="tab-npcs" class="tab-pane">
      <div class="generator-toolbar">
        <button class="btn btn-action" id="genNpcBtn">PNJ Completo (Rasgos & Secreto)</button>
        <button class="btn btn-action" id="genFollowerBtn">Generar Seguidor (PG, Coste, Instinto)</button>
        <button class="btn btn-action" id="genRivalsBtn">Aventurero Rival</button>
      </div>
      <div class="preview-stage" id="npcs-preview"></div>
    </section>

    <section id="tab-encuentros" class="tab-pane">
  <div class="generator-toolbar">
    <select id="biomeSelect">
      <option value="dungeon">Mazmorra (Niveles 1-3)</option>
        <option value="slums">Suburbios / Bajos Fondos</option>
        <option value="swamp">Pantano / Ciénaga</option>
        <option value="tomb">Tumbas / Criptas</option>
        <option value="ruins">Ruinas / Edificaciones Antiguas</option>
        <option value="university_district">Distrito Universitario</option>
        <option value="temple_district">Distrito del Templo</option>
        <option value="ocean">Océano / Alta Mar</option>
        <option value="tavern">Taberna / Posada</option>
        <option value="river_coast">Ríos y Costas</option>
        <option value="mountain">Montaña / Cumbres</option>
        <option value="market">Distrito del Mercado</option>
        <option value="low_district">Distrito Bajo</option>
        <option value="jungle">Jungla / Selva Tropical</option>
        <option value="high_district">Distrito Alto</option>
        <option value="grassland">Praderas y Llanuras</option>
        <option value="forest">Bosque / Floresta</option>
        <option value="desert">Desierto / Arenas</option>
        <option value="deep_tunnels">Túneles Profundos / Underdark</option>
        <option value="cave">Cuevas / Subterráneo</option>
        <option value="castle">Distrito del Castillo</option>
        <option value="artisan">Distrito Artesanal</option>
      <option value="arctic">Ártico / Tierras Heladas</option>
      <option value="cave">Cuevas / Subterráneo</option>
      <option value="forest">Bosque</option>
      <option value="swamp">Pantano</option>
      <option value="mountain">Montaña</option>
      <option value="slums">Bajos Fondos</option>
    </select>

    <div style="display: inline-flex; align-items: center; gap: 6px; background: var(--bg-input); padding: 3px 8px; border: 1px solid var(--border-color); border-radius: 3px;">
      <label style="font-size: 0.75rem; color: var(--accent-gold); font-weight: bold;">Mod. Carisma (CHA):</label>
      <select id="chaModInput" style="padding: 2px 6px; font-weight: bold;">
        <option value="-4">-4</option>
        <option value="-3">-3</option>
        <option value="-2">-2</option>
        <option value="-1">-1</option>
        <option value="0" selected>+0</option>
        <option value="1">+1</option>
        <option value="2">+2</option>
        <option value="3">+3</option>
        <option value="4">+4</option>
      </select>
    </div>

    <button class="btn btn-action" id="genEncounterBtn">🎲 Generar Encuentro Completo</button>
    <button id="btnRollSomething" class="btn btn-action">
  <i class="fa-solid fa-bolt"></i> ¡Algo Sucede!
</button>
    <button class="btn btn-action" id="genRumorBtn">📜 Sembrar Rumor</button>
  </div>
  <div class="preview-stage" id="encuentros-preview"></div>
</section>

    <section id="tab-monstruos" class="tab-pane">
      <div class="generator-toolbar">
        <input type="text" id="monsterSearchInput" placeholder="Buscar criatura por nombre (ej. Balor, Basilisco, Goblin, Trol)..." style="width: 340px;">
      </div>
      <div class="monster-search-results" id="monsterSearchResults"></div>
    </section>
      
   <section id="tab-tesoros" class="tab-pane">
      <div class="generator-toolbar">
        <select id="treasureTierSelect">
          <option value="0-3">Tesoro Niveles 0–3 (d100 Oficial)</option>
          <option value="4-6">Tesoro Niveles 4–6 (d100 Oficial)</option>
          <option value="7-9">Tesoro Niveles 7–9 (d100 Oficial)</option>
          <option value="10+">Tesoro Niveles 10+ (d100 Oficial)</option>
        </select>
        <button class="btn btn-action-accent" id="genTierTreasureBtn">🎲 Tirar Tesoro (d100)</button>
        <button class="btn btn-action-accent" id="genFullMagicItemBtn">✨ Objeto Mágico Aleatorio (d6)</button>
        <button class="btn btn-action" id="genSingularMagicItemBtn">👑 Artefacto Singular</button>
      </div>

      <div class="generator-toolbar" style="margin-top: 6px;">
        <button class="btn btn-action" id="genWeaponBtn">⚔️ Arma Mágica</button>
        <button class="btn btn-action" id="genArmorBtn">🛡️ Armadura / Escudo</button>
        <button class="btn btn-action" id="genUtilityBtn">💍 Objeto de Utilidad</button>
        <button class="btn btn-action" id="genPotionBtn">🧪 Poción Mágica</button>
        <button class="btn btn-action" id="genMixPotionsBtn">💥 Mezclar Pociones</button>
        <button class="btn btn-action" id="genScrollBtn">📜 Pergamino</button>
        <button class="btn btn-action" id="genWandBtn">🪄 Varita</button>
      </div>

      <div class="generator-toolbar" style="margin-top: 6px;">
        <button class="btn btn-action" id="genGemBtn">💎 Gema Preciosa</button>
        <button class="btn btn-action" id="genLuxuryBtn">🏺 Objeto de Lujo / Arte</button>
        <button class="btn btn-action" id="genBoonBtn">✨ Don (Juramento/Secreto/Bendición)</button>
      </div>

      <div class="preview-stage" id="tesoros-preview"></div>
    </section>

  </main>

  <section class="gm-screen-container">
    <div class="gm-screen-header">
      <h2>📌 PANTALLA DE GM // TABLERO DE SESIÓN EN VIVO</h2>
      <div class="threat-clock-actions">
        <input type="text" id="newClockTitle" placeholder="Nombre de Amenaza (ej. Guardia en camino, Ritual)">
        <select id="newClockSegments">
          <option value="4">4 Segmentos</option>
          <option value="6" selected>6 Segmentos</option>
          <option value="8">8 Segmentos</option>
        </select>
        <button id="btnAddClockBtn" class="btn btn-action-accent">+ Añadir Reloj</button>
      </div>
    </div>

    <div class="threat-clocks-bar" id="threatClocksContainer"></div>

    <div class="gm-screen-grid">
      <div class="gm-column" data-col="mundo">
        <div class="column-header">
          <h3>🗺️ MUNDO & SOCIEDAD</h3>
          <button class="btn-clear-col" title="Limpiar columna">×</button>
        </div>
        <div class="column-cards" id="gm-col-mundo"></div>
      </div>

      <div class="gm-column" data-col="combate">
        <div class="column-header">
          <h3>⚔️ BESTIAS & COMBATE</h3>
          <button class="btn-clear-col" title="Limpiar columna">×</button>
        </div>
        <div class="column-cards" id="gm-col-combate"></div>
      </div>

      <div class="gm-column" data-col="mazmorra">
        <div class="column-header">
          <h3>🗝️ MAZMORRAS & ÁREAS</h3>
          <button class="btn-clear-col" title="Limpiar columna">×</button>
        </div>
        <div class="column-cards" id="gm-col-mazmorra"></div>
      </div>

      <div class="gm-column" data-col="eventos">
        <div class="column-header">
          <h3>⚡ ENCUENTROS & AMENAZAS</h3>
          <button class="btn-clear-col" title="Limpiar columna">×</button>
        </div>
        <div class="column-cards" id="gm-col-eventos"></div>
      </div>
    </div>
  </section>

  <script src="js/data/monsters.js"></script>
    <script src="js/data/encounters/enc_ocean.js"></script>
  <script src="js/data/tables/oracle_tables.js"></script>
  <script src="js/data/tables/mundane_tables.js"></script>
  <script src="js/data/tables/magic_armor.js"></script>
<script src="js/data/tables/magic_weapons.js"></script>
<script src="js/data/tables/magic_utility.js"></script>
    <script src="js/data/tables/rumors.js"></script>
    <script src="js/data/tables/something_happens.js"></script>
  <script src="js/data/tables/magic_spells.js"></script>
  <script src="js/data/tables/magic_potions.js"></script>
    <script src="js/data/encounters/enc_tavern.js"></script>
    <script src="js/data/encounters/enc_slums.js"></script>
    <script src="js/data/encounters/enc_swamp.js"></script>
    <script src="js/data/encounters/enc_ruins.js"></script>
    <script src="js/data/encounters/enc_river_coast.js"></script>
  <script src="js/data/tables/magic_personality.js"></script>
    <script src="js/data/encounters/enc_university_district.js"></script>
    <script src="js/data/encounters/enc_temple_district.js"></script>
    <script src="js/data/encounters/enc_tomb.js"></script>
    <script src="js/data/encounters/enc_mountain.js"></script>
  <script src="js/data/tables/singular_items.js"></script>
    <script src="js/data/encounters/enc_market.js"></script>
    <script src="js/data/encounters/enc_low_district.js"></script>
    <script src="js/data/encounters/enc_jungle.js"></script>
    <script src="js/data/encounters/enc_high_district.js"></script>
    <script src="js/data/encounters/enc_grassland.js"></script>
    <script src="js/data/encounters/enc_forest.js"></script>
    <script src="js/data/encounters/enc_desert.js"></script>
    <script src="js/data/encounters/enc_deep_tunnels.js"></script>
    <script src="js/data/encounters/enc_cave.js"></script>
    <script src="js/data/encounters/enc_castle.js"></script>
    <script src="js/data/encounters/enc_artisan.js"></script>
  <script src="js/data/encounters/enc_arctic.js"></script>
  <script src="js/data/cartography.js"></script>
  <script src="js/data/settlements.js"></script>
  <script src="js/data/dungeons.js"></script>
  <script src="js/data/npcs.js"></script>
  <script src="js/data/encounters/encountersEngine.js"></script>
  <script src="js/data/encounters/enc_dungeon_1_3.js"></script>
  <script src="js/data/treasure.js"></script>
  
  <script src="js/components/threatClock.js"></script>
  <script src="js/components/monsterCard.js"></script>
  
  <script src="js/app.js"></script>
</body>
</html>
